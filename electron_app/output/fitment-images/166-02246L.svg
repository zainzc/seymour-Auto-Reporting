<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="1200" fill="#E3C028"/>
  <rect x="0" y="0" width="1200" height="1200" filter="url(#grain)"/>
  <rect x="38" y="38" width="1124" height="1124" fill="none" stroke="#111111" stroke-width="22" rx="30"/>

  <text x="600" y="182" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="156" font-weight="900" fill="#111111" letter-spacing="2">FITS</text>
  <text x="600" y="260" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="44" font-weight="800" fill="#111111">THIS PART IS COMPATIBLE WITH:</text>

  <text x="600" y="430" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="60" font-weight="900" fill="#111111">FITS 2008-2017</text>
<text x="600" y="510" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="60" font-weight="900" fill="#111111">PATRIOT, TAIL LIGHT.</text>
  <text x="600" y="900" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="52" font-weight="900" fill="#111111">DRIVER (LEFT)</text>
  <text x="600" y="1162" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="20" font-weight="700" fill="#111111">IPN 166-02246L</text>
