<text x="600" y="405" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  (ONSTAR, OPTION UE1), AUTOMATIC</text>
<text x="600" y="455" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  DIMMING MIRROR (OPTION DD8), AND</text>
<text x="600" y="505" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  AUTOMATIC HIGH BEAM (OPTION TQ5).</text>
<text x="600" y="555" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">- ALSO FITS 2009 STS WITH AUTOMATIC</text>
<text x="600" y="605" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  DIMMING MIRROR (OPTION DD8),</text>
<text x="600" y="655" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  TELEMATICS (ONSTAR, OPTION UE1),</text>
<text x="600" y="705" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  AUTOMATIC HIGH BEAM (OPTION TQ5), AND</text>
<text x="600" y="755" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">  MICROPHONE.</text>
  
  <text x="600" y="1162" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="20" font-weight="700" fill="#111111">IPN 267-00232</text>
