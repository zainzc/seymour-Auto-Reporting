<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Title Structure</title><link rel="stylesheet" href="category-rules.css"></head><body><main class="workspace-shell"><nav class="workspace-navigation"><button class="back-link" data-navigate="../milestone1/index.html">← Back to Milestone 1</button><div class="workspace-links"><button data-navigate="../milestone1/powerlink-sheets.html">Inventory Sync Workspace</button><button data-navigate="../milestone1/phase2-master-parts.html">Master Parts Sync Workspace</button><button class="active">Title Optimization Workspace</button></div></nav><nav class="tab-navigation" aria-label="Title Optimization sections"><button disabled>Overview</button><button data-navigate="source-fields.html">Source Fields</button><button data-navigate="source-priority.html">Source Priority</button><button data-navigate="terminology-rules.html">Terminology Rules</button><button data-navigate="synonyms.html">Synonyms</button><button data-navigate="prefix-rules.html">Prefix Rules</button><button data-navigate="restricted-terms.html">Restricted Terms</button><button data-navigate="category-rules.html">Category Rules</button><button class="active" aria-current="page">Title Structure</button><button disabled>Flag Reasons</button><button disabled>System Rules</button></nav><section class="source-card"><div class="card-header"><div><h1>Title Structure</h1><p>Configure the preferred component order used when constructing optimized listing titles.</p></div><button id="add" class="button primary">+ Add Structure</button></div><div class="rules-toolbar"><input id="search" type="search" placeholder="Search structures…"><select id="status"><option value="all">Status: All</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option></select><select id="origin"><option value="all">Origin: All</option><option value="client-v5">Client v5</option><option value="custom">Custom</option></select></div><div id="message" class="notice" hidden></div><div class="table-container terminology-table"><table><thead><tr><th>Structure Name</th><th>Applies To</th><th>Structure Preview</th><th>Origin</th><th>Enabled</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="editor" class="rule-editor-dialog editor-card"><h2 id="heading">Add Title Structure</h2><form id="form"><label>Structure Name *<input id="name" required></label><label>Applies To *<input id="applies" required></label><label>Notes<textarea id="note" rows="4"></textarea></label><fieldset><legend>Ordered Segments *</legend><div id="segments"></div><div><input id="segment-label" placeholder="Segment label"><select id="segment-kind"><option value="field">Field</option><option value="literal">Literal</option></select><button id="segment-add" type="button" class="button secondary">Add Segment</button></div></fieldset><label class="editor-toggle">Enabled <input id="enabled" type="checkbox"></label><div class="editor-actions"><button id="cancel" type="button" class="button secondary">Cancel</button><button class="button primary">Save Structure</button></div></form></dialog><script src="title-structure.js"></script><script>const c=TitleOptimizationTitleStructures.createTitleStructureController({api:window.titleOptimizationTitleStructuresAPI,onChange:render,confirmDiscard:async()=>confirm('Discard unsaved Title Structure changes?'),confirmDelete:async()=>confirm('Delete this custom Title Structure?')});const $=id=>document.getElementById(id);function render(){const s=c.state; $('rows').innerHTML=c.filtered().map(x=>`<tr><td>${x.structureName}</td><td>${x.appliesTo}</td><td>${(x.segments||[]).map(y=>y.label).join(' → ')}</td><td>${x.origin}</td><td><input type="checkbox" ${x.enabled?'checked':''} data-toggle="${x.id}"></td><td><button data-edit="${x.id}" class="button secondary">Edit</button>${x.origin==='custom'?` <button data-delete="${x.id}" class="button danger">Delete</button>`:''}</td></tr>`).join('');$('message').hidden=!s.error&&!s.success;$('message').textContent=s.error||s.success;$('name').value=s.form.structureName;$('applies').value=s.form.appliesTo;$('note').value=s.form.note;$('enabled').checked=s.form.enabled;$('heading').textContent=s.editingId?'Edit Title Structure':'Add Title Structure';$('segments').innerHTML=s.form.segments.map((x,i)=>`<div class="detail-item"><span>${i+1}. ${x.label} <small>(${x.kind})</small></span><button type="button" data-up="${i}">↑</button><button type="button" data-down="${i}">↓</button><button type="button" data-remove="${i}">×</button></div>`).join('');}document.addEventListener('click',async e=>{const t=e.target;if(t.id==='add'){await c.beginAdd();$('editor').showModal();}if(t.dataset.edit){await c.beginEdit(t.dataset.edit);$('editor').showModal();}if(t.dataset.delete)await c.remove(t.dataset.delete);if(t.dataset.toggle)await c.toggle(t.dataset.toggle,t.checked);if(t.dataset.up)c.moveSegment(+t.dataset.up,-1);if(t.dataset.down)c.moveSegment(+t.dataset.down,1);if(t.dataset.remove)c.removeSegment(+t.dataset.remove);if(t.id==='segment-add')c.addSegment($('segment-label').value,$('segment-kind').value);if(t.id==='cancel'){$('editor').close();}});$('form').addEventListener('submit',async e=>{e.preventDefault();c.setField('structureName',$('name').value);c.setField('appliesTo',$('applies').value);c.setField('note',$('note').value);c.setField('enabled',$('enabled').checked);if(await c.save())$('editor').close();});$('search').oninput=e=>{c.state.search=e.target.value;render();};$('status').onchange=e=>{c.state.status=e.target.value;render();};$('origin').onchange=e=>{c.state.origin=e.target.value;render();};c.load();</script></body></html>
