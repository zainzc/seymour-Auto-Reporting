<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Setup</title>
  <style>
    :root {
      --bg: #eef4fb;
      --surface: #ffffff;
      --text: #14263f;
      --muted: #617490;
      --border: #d2deec;
      --brand: #0b5cab;
      --brand-strong: #084a8a;
      --success-bg: #ddf4ec;
      --success-text: #0f6f56;
      --error-bg: #f8dddb;
      --error-text: #8f2620;
      --info-bg: #dce9fb;
      --info-text: #184f97;
      --shadow: 0 20px 34px rgba(8, 33, 62, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 12px;
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 92% 6%, rgba(11, 92, 171, 0.14), transparent 34%),
        radial-gradient(circle at 8% 8%, rgba(15, 138, 106, 0.11), transparent 34%),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px 22px;
    }

    .title {
      margin: 0 0 4px;
      font-size: 28px;
      color: #173254;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .auth-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .auth-option {
      border: 1px solid #c5d5e9;
      border-radius: 10px;
      background: #f6faff;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .auth-option input[type="radio"] {
      margin: 0;
      accent-color: var(--brand);
      width: 16px;
      height: 16px;
    }

    .auth-option label {
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #28507b;
    }

    .form-stack {
      display: grid;
      gap: 10px;
    }

    input {
      width: 100%;
      border: 1px solid #bfd0e5;
      border-radius: 10px;
      background: #fcfdff;
      color: #173454;
      font-size: 14px;
      padding: 11px 12px;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(11, 92, 171, 0.14);
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .error {
      color: var(--error-text);
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }

    .status {
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      line-height: 1.4;
    }

    .btn-primary {
      width: 100%;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: var(--brand);
      box-shadow: 0 10px 18px rgba(11, 92, 171, 0.26);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--brand-strong);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      cursor: not-allowed;
      opacity: 0.75;
      transform: none;
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 540px) {
      .card {
        padding: 18px 14px;
      }

      .title {
        font-size: 24px;
      }

      .auth-selector {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">Database Setup</h1>
    <p class="subtitle">Configure SQL access to initialize the application workspace.</p>

    <div class="auth-selector">
      <div class="auth-option">
        <input type="radio" id="sqlAuth" name="authType" value="sql" checked />
        <label for="sqlAuth">SQL Authentication</label>
      </div>
      <div class="auth-option">
        <input type="radio" id="windowsAuth" name="authType" value="windows" />
        <label for="windowsAuth">Windows Auth</label>
      </div>
    </div>

    <div id="sqlAuthDiv" class="form-stack">
      <input id="host" placeholder="Server (localhost\\SQLEXPRESS or IP)" />
      <input id="user" placeholder="Username (sa or domain\\user)" />
      <input id="password" type="password" placeholder="Password" />
      <input id="database" placeholder="Database Name" />
    </div>

    <div id="windowsAuthDiv" class="form-stack" style="display: none;">
      <input id="hostWin" placeholder="Server (e.g., 192.168.103.163)" />
      <input id="portWin" placeholder="Port (e.g., 9400 or 1433)" type="number" />
      <input id="databaseWin" placeholder="Database Name" />
    </div>

    <p class="note">Use "Test Connection & Continue" to validate credentials before saving.</p>
    <div id="errorMsg" class="error"></div>
    <div id="statusMsg" class="status"></div>
    <button id="submitBtn" class="btn-primary" onclick="testAndSave()">Test Connection & Continue</button>
  </div>

  <script>
    window.addEventListener('load', () => {
      document.getElementById('host').value = '';
      document.getElementById('user').value = '';
      document.getElementById('password').value = '';
      document.getElementById('database').value = '';
      document.getElementById('hostWin').value = '';
      document.getElementById('portWin').value = '';
      document.getElementById('databaseWin').value = '';

      document.getElementById('errorMsg').textContent = '';
      document.getElementById('statusMsg').style.display = 'none';
      document.getElementById('statusMsg').textContent = '';

      document.getElementById('sqlAuth').checked = true;
      document.getElementById('sqlAuthDiv').style.display = 'grid';
      document.getElementById('windowsAuthDiv').style.display = 'none';

      const button = document.getElementById('submitBtn');
      button.disabled = false;
      button.style.opacity = '1';
      button.style.cursor = 'pointer';
      button.style.pointerEvents = 'auto';

      document.querySelectorAll('input, button').forEach(elem => {
        elem.style.pointerEvents = 'auto';
        if (elem.tagName !== 'BUTTON') {
          elem.disabled = false;
        }
      });
    });

    document.querySelectorAll('input[name="authType"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const authType = document.querySelector('input[name="authType"]:checked').value;
        document.getElementById('sqlAuthDiv').style.display = authType === 'sql' ? 'grid' : 'none';
        document.getElementById('windowsAuthDiv').style.display = authType === 'windows' ? 'grid' : 'none';
      });
    });

    async function testAndSave() {
      const authType = document.querySelector('input[name="authType"]:checked').value;
      const errorMsg = document.getElementById('errorMsg');
      const statusMsg = document.getElementById('statusMsg');
      const button = document.getElementById('submitBtn');

      errorMsg.textContent = '';
      let config;
      let testRes;

      if (authType === 'sql') {
        config = {
          server: document.getElementById('host').value.trim(),
          user: document.getElementById('user').value.trim(),
          password: document.getElementById('password').value,
          database: document.getElementById('database').value.trim(),
          authType: 'sql'
        };

        if (!config.server) {
          errorMsg.textContent = 'Server is required';
          return;
        }
        if (!config.user) {
          errorMsg.textContent = 'Username is required';
          return;
        }
        if (!config.password) {
          errorMsg.textContent = 'Password is required';
          return;
        }
        if (!config.database) {
          errorMsg.textContent = 'Database name is required';
          return;
        }
      } else {
        const server = document.getElementById('hostWin').value.trim();
        const port = document.getElementById('portWin').value.trim();

        config = {
          server: port ? `${server},${port}` : server,
          database: document.getElementById('databaseWin').value.trim(),
          authType: 'windows'
        };

        if (!server) {
          errorMsg.textContent = 'Server is required';
          return;
        }
        if (!config.database) {
          errorMsg.textContent = 'Database name is required';
          return;
        }
      }

      statusMsg.style.display = 'block';
      statusMsg.style.background = 'var(--info-bg)';
      statusMsg.style.color = 'var(--info-text)';
      statusMsg.innerHTML = '<span class="loading">o</span> Testing connection...';
      button.disabled = true;

      try {
        if (authType === 'sql') {
          testRes = await window.api.testDbConnection(config);
        } else {
          testRes = await window.api.testWindowsAuth(config);
        }

        if (!testRes.success) {
          statusMsg.style.background = 'var(--error-bg)';
          statusMsg.style.color = 'var(--error-text)';
          statusMsg.textContent = 'Connection failed: ' + testRes.message;
          button.disabled = false;
          return;
        }

        statusMsg.style.background = 'var(--success-bg)';
        statusMsg.style.color = 'var(--success-text)';
        statusMsg.textContent = 'Connection successful. Saving configuration...';

        setTimeout(async () => {
          const res = await window.api.saveConfig(config);

          if (res.success) {
            window.location.replace('../main-dashboard.html');
          } else {
            statusMsg.style.background = 'var(--error-bg)';
            statusMsg.style.color = 'var(--error-text)';
            statusMsg.textContent = 'Save failed: ' + res.message;
            button.disabled = false;
          }
        }, 800);
      } catch (err) {
        statusMsg.style.display = 'block';
        statusMsg.style.background = 'var(--error-bg)';
        statusMsg.style.color = 'var(--error-text)';
        statusMsg.textContent = 'Error: ' + err.message;
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
